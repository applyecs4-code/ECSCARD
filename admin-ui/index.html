<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Apply ECS – Admin</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0;color:#222}
header{flex-wrap:wrap;gap:8px;background:#005a9c;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;margin-left:14px;text-decoration:none;cursor:pointer;display:inline-block;padding:3px 0}
header a.on{border-bottom:2px solid #fff;font-weight:bold}
header #nav{line-height:1.9}
main{max-width:1150px;margin:20px auto;padding:0 14px}
.card{background:#fff;border-radius:8px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px #0002}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{flex:1;min-width:110px;background:#fff;padding:12px;border-radius:8px;text-align:center;box-shadow:0 1px 3px #0002}
.stat b{display:block;font-size:22px;color:#005a9c}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid #eee}th{background:#fafafa}
.wrap{overflow-x:auto}input,select,textarea,button{padding:8px;font-size:14px;border:1px solid #ccc;border-radius:5px}
button,.btn{background:#005a9c;color:#fff;border:0;cursor:pointer;text-decoration:none;padding:8px 14px;border-radius:5px;display:inline-block;font-size:14px}
.red{background:#c0392b}.tag{padding:2px 8px;border-radius:10px;background:#e8f0fe;font-size:12px}
.badge{background:#c8102e;color:#fff;padding:2px 8px;border-radius:10px;font-size:12px;margin-left:4px}
.err{color:#c0392b}.ok{color:green}th.k{width:200px}.full{width:100%;box-sizing:border-box}

.sw{position:relative;display:inline-block;width:44px;height:24px;flex:none}.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#c0392b;border-radius:24px;cursor:pointer;transition:.2s}
.sw span:before{content:'';position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:#27ae60}.sw input:checked+span:before{transform:translateX(20px)}
.mi{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid #f0f0f0}
.st{font-size:12px;border-radius:10px;padding:1px 8px;min-width:50px;text-align:center}.st.vis{background:#d4f3d4}.st.hid{background:#fbd5d0}
.lb.grp{font-weight:bold}
.chip{display:inline-block;background:#fbd5d0;border-radius:14px;padding:3px 10px;margin:3px}.chip b{cursor:pointer;margin-left:6px}
</style></head><body>
<header><b>Apply ECS – Admin</b><span id="nav"></span></header>
<main id="app">Loading…</main>
<script src="/admin/admin.js"></script>
</body></html>
