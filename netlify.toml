[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# ---- Old PHP URLs keep working, so book.html / ecscardbooking.html / contact.html need no change ----
[[redirects]]
  from = "/admin/receive.php"
  to = "/admin-api/receive"
  status = 200
  force = true

[[redirects]]
  from = "/admin/enquiry.php"
  to = "/admin-api/enquiry"
  status = 200
  force = true

# ---- Blog: public pages are rendered by the function; only blogs marked "live" in Admin > Blogs are served ----
[[redirects]]
  from = "/blog"
  to = "/admin-api/blog-index"
  status = 200
  force = true

[[redirects]]
  from = "/blog/"
  to = "/admin-api/blog-index"
  status = 200
  force = true

[[redirects]]
  from = "/blog/:slug"
  to = "/admin-api/blog-post/:slug"
  status = 200
  force = true

[[redirects]]
  from = "/blog-sitemap.xml"
  to = "/admin-api/blog-sitemap"
  status = 200
  force = true

# ---- Design settings -> generated CSS ----
[[redirects]]
  from = "/site-custom.css"
  to = "/admin-api/site-css"
  status = 200
  force = true

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"

# ---- local dev (npm run dev): build first, then serve dist ----
[dev]
  command = ""
  publish = "dist"
  port = 8888
  autoLaunch = false
